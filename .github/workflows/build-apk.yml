
name: Build Root Checker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip RootCheckerPanel_Source.zip -d .

      - name: Build APK
        run: gradle -p RootCheckerPanel assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootCheckerPanel-APK
          path: RootCheckerPanel/app/build/outputs/apk/debug/app-debug.apk
          
