
name: Build Root Checker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip RootCheckerPanel_Source.zip -d .

      - name: Build APK
        run: gradle -p RootCheckerPanel assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootCheckerPanel-APK
          path: RootCheckerPanel/app/build/outputs/apk/debug/app-debug.apk
          
